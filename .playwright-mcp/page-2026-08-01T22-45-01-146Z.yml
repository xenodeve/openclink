  - generic [ref=e15]:
    - heading "AA-AgentPerf Methodology" [level=1] [ref=e17]
    - generic [ref=e18]:
      - heading [level=2] [ref=e19]:
        - link "Overview" [ref=e20] [cursor=pointer]:
          - /url: "#overview"
      - paragraph [ref=e21]: AA-AgentPerf is a hardware benchmark that measures how many active agents an inference deployment can support under realistic agentic workloads while meeting per-agent speed targets.
      - list [ref=e22]:
        - listitem [ref=e23]:
          - strong [ref=e24]: Real agentic trajectories
          - text: — multi-turn coding sessions with interleaved reasoning, tool calls, and variable context lengths (not synthetic uniform prompts).
        - listitem [ref=e25]:
          - strong [ref=e26]: Sustained concurrent load
          - text: — simulated agents maintain continuous in-flight requests, stressing KV cache reuse, speculative decoding, and scheduler behavior.
        - listitem [ref=e27]:
          - strong [ref=e28]: Market-derived SLO tiers
          - text: — performance thresholds based on Artificial Analysis serverless API benchmarking data, reflecting quality-of-service levels observed across providers.
        - listitem [ref=e29]:
          - strong [ref=e30]: Continuously updated
          - text: — results are updated on an ongoing basis as new hardware, software stacks, and model versions become available.
        - listitem [ref=e31]:
          - strong [ref=e32]: Production ready
          - text: — models are tested with realistic optimizations enabled and production-scale deployment topologies.
      - img "Animation showing simulated agents working through agentic coding trajectories around a central inference system" [ref=e34]:
        - generic [ref=e36]: concurrent agents
        - generic [ref=e37]:
