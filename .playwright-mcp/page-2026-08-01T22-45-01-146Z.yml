      - paragraph [ref=e107]: Each simulated agent works sequentially through agentic coding trajectories — reasoning, calling tools, and editing code — while the system scales to support increasing concurrency.
    - generic [ref=e108]:
      - heading [level=2] [ref=e109]:
        - link "Dataset" [ref=e110] [cursor=pointer]:
          - /url: "#dataset"
      - paragraph [ref=e111]: The AA-AgentPerf dataset contains real agentic trajectories covering several use cases, programming languages, and models. Trajectories were generated in the OpenCode agentic harness using three top open-source models with reasoning enabled — DeepSeek V3.2, GLM 4.7, and Kimi K2.5 — prompted to resolve issues in real public code repositories. All trajectories include interleaved reasoning and tool calls.
      - list [ref=e112]:
        - listitem [ref=e113]:
          - strong [ref=e114]: "Input Sequence Length (ISL):"
          - text: Ranges from ~5K to ~131K tokens, with a mean of approximately 27K tokens. Trajectories are truncated to fit within the maximum recommended context length of the models under test.
        - listitem [ref=e115]:
          - strong [ref=e116]: "Output Sequence Length (OSL):"
          - text: Output lengths vary widely across turns — some turns produce short outputs such as simple tool calls, while others involve extended reasoning before the model responds or acts.
        - listitem [ref=e117]:
          - strong [ref=e118]: "Languages:"
          - text: 12+ programming languages are represented, based on the primary language of the source repository. Python repositories are the most frequent source, followed by TypeScript and Go.
        - listitem [ref=e119]:
          - strong [ref=e120]: "Tool call delays:"
          - text: After each tool call, processing time is simulated with a fixed per-message delay sampled from a distribution of real tool call durations, partitioned by the tool being called. Delays range from under 0.1s up to 5s, with a median of approximately 1 second.
      - paragraph [ref=e121]: A representative tuning subset — 500 unique trajectories comprising 18,997 prompts — is provided to test participants for configuration validation and performance tuning. The full test dataset is kept private to prevent benchmark-targeted optimizations.
    - generic [ref=e122]:
      - heading [level=2] [ref=e123]:
        - link "Service-Level Objectives" [ref=e124] [cursor=pointer]:
          - /url: "#service-level-objectives"
      - paragraph [ref=e125]: Performance SLOs are determined based on Artificial Analysis serverless API benchmarking data. Currently available tiers of service in the market have been identified for each model being tested. Vendors target each tier separately, maximizing the number of concurrent agents they can support at that level of service.
      - paragraph [ref=e126]: Speed and latency are both calculated at a per-request level. Due to the large number of small-OSL requests in agentic workloads, P25 output speed is used, with percentiles computed over all requests sent during a phase.
      - paragraph [ref=e127]: "Each model is tested with creator-recommended sampling parameters at the maximum thinking effort available: max reasoning effort for DeepSeek V4 Pro and Kimi K3, and high reasoning effort for gpt-oss-120b, with all other parameters set to defaults."
      - paragraph [ref=e128]: We are currently transitioning from separate Output Speed and TTFT metrics to a combined E2E Speed metric. During this transition, some stats will be quoted in Speed/TTFT and some will be quoted in E2E Speed.
