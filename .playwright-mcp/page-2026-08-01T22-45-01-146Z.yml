      - paragraph [ref=e246]: As concurrent agents increase, per-request output speed degrades. Each SLO tier defines a minimum acceptable speed, determining the maximum agents that tier can support.
    - generic [ref=e247]:
      - heading [level=2] [ref=e248]:
        - link "Metrics & Results" [ref=e249] [cursor=pointer]:
          - /url: "#metrics"
      - paragraph [ref=e250]: "The following timing metrics are calculated during each test phase:"
      - list [ref=e251]:
        - listitem [ref=e252]:
          - strong [ref=e253]: "Time to First Token (TTFT):"
          - text: Per-request latency from sending the request to receiving the first output token.
        - listitem [ref=e254]:
          - strong [ref=e255]: "Output Speed:"
          - text: Per-request output tokens per second, measured after the first token is received.
        - listitem [ref=e256]:
          - strong [ref=e257]: "E2E Speed:"
          - text: Per-request output tokens per second across the full request, including the wait for the first token. This single metric is replacing the two above.
        - listitem [ref=e258]:
          - strong [ref=e259]: "System Output Throughput:"
          - text: Aggregate output tokens per second across all concurrent agents.
      - paragraph [ref=e260]: All metrics are filtered to steady-state periods where all agents have been active for at least 30 seconds at target concurrency. Speed metrics use server-side token counts from the usage metadata returned by the inference framework, verified against local tokenization with the candidate model's native tokenizer. Power draw is measured from each accelerator during the live test. The primary results — maximum concurrent agents and output throughput at each SLO tier — are normalized per accelerator and per MW to enable fair comparison across hardware configurations. Per-MW figures are based on measured accelerator power under load (GPU die + HBM) rather than rated TDP.
      - paragraph [ref=e261]: Results are published on the Artificial Analysis leaderboard with full system configurations as disclosed by the provider. Providers may review their results for factual accuracy before publication.
