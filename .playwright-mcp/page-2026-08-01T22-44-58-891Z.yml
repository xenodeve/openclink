      - generic [ref=f2e533]:
        - heading "Landscape Summary" [level=3] [ref=f2e534]
        - paragraph [ref=f2e535]: The table compares general work agents across platform availability, open-source status, bring-your-own-model support, local file access, browser automation, and pricing. Microsoft Copilot and Manus offer the broadest platform support (desktop + web + mobile), while ChatGPT Agent covers web, mobile, and desktop. Claude Cowork and OpenClaw are desktop-only. Google Workspace Studio, Gemini Enterprise, and Microsoft Copilot Cowork are web-only. Most agents support local file access — ChatGPT Agent is the notable exception, running entirely on a cloud VM. Browser automation is available in Claude Cowork, ChatGPT Agent, OpenClaw, Manus, and partially in Microsoft Copilot. Pricing ranges from free open-source (OpenClaw) through $8–30/mo subscriptions (Google Workspace Studio, Microsoft Copilot, Gemini Enterprise) up to $200/mo tiers (Claude Cowork, ChatGPT Agent, Manus).
      - generic [ref=f2e536]:
        - heading "Frequently Asked Questions" [level=2] [ref=f2e538]
        - generic [ref=f2e539]:
          - generic [ref=f2e540]:
            - heading [level=3] [ref=f2e541]:
              - button "What are general work AI agents?" [ref=f2e542] [cursor=pointer]
            - region "What are general work AI agents?":
              - paragraph [ref=f2e546]: General work AI agents are AI systems that autonomously execute multi-step tasks over extended periods. They read and write files on your desktop or in cloud sandboxes, perform broad knowledge work tasks, and typically connect to external services like email, calendars, Slack, and CRM. Unlike coding agents, they target everyday office and administrative tasks for non-developer knowledge workers.
          - generic [ref=f2e547]:
            - heading [level=3] [ref=f2e548]:
              - button "Which agents support local file access?" [ref=f2e549] [cursor=pointer]
            - region "Which agents support local file access?":
              - paragraph [ref=f2e553]: "Most agents in the table support local file access: Claude Cowork, OpenClaw, Microsoft Copilot, Google Workspace Studio, Manus, and Microsoft Copilot Cowork. ChatGPT Agent is the notable exception — it runs entirely on a cloud VM with no local file access. Gemini Enterprise offers partial access via connectors to SharePoint, Confluence, and other enterprise systems."
          - generic [ref=f2e554]:
            - heading [level=3] [ref=f2e555]:
              - button "Which agents support browser automation?" [ref=f2e556] [cursor=pointer]
            - region "Which agents support browser automation?":
              - paragraph [ref=f2e560]: Claude Cowork, ChatGPT Agent, OpenClaw, and Manus all support browser automation. Microsoft Copilot offers partial browser automation via Copilot Studio. The remaining agents (Google Workspace Studio, Gemini Enterprise, Microsoft Copilot Cowork) do not include browser automation.
          - generic [ref=f2e561]:
            - heading [level=3] [ref=f2e562]:
              - button "Are there free or open-source general work AI agents?" [ref=f2e563] [cursor=pointer]
            - region "Are there free or open-source general work AI agents?":
              - paragraph [ref=f2e567]: OpenClaw is fully open-source and free (you pay only for LLM API calls). Microsoft Copilot has a partial BYOM option via Copilot Studio. The remaining agents are closed-source and require subscriptions ranging from ~$8/mo (Google Workspace Studio) to $200/mo (Claude Cowork, ChatGPT Agent).
          - generic [ref=f2e568]:
