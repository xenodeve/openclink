  - generic [ref=f1e15]:
    - heading "Artificial Analysis Language Model API Performance Benchmarking Methodology" [level=1] [ref=f1e17]
    - generic [ref=f1e18]:
      - heading [level=2] [ref=f1e19]:
        - link "Overview" [ref=f1e20] [cursor=pointer]:
          - /url: "#overview"
      - paragraph [ref=f1e21]: Measuring LLM performance requires sending the LLM a prompt and measuring the characteristics of its output. We use a variety of test workloads to test and measure LLM performance.
      - generic [ref=f1e22]:
        - heading [level=3] [ref=f1e23]:
          - link "Workload Types" [ref=f1e24] [cursor=pointer]:
            - /url: "#workload-types"
        - table [ref=f1e26]:
          - rowgroup [ref=f1e27]:
            - row [ref=f1e28]:
              - columnheader "Workload type" [ref=f1e29]
              - columnheader "Description" [ref=f1e30]
          - rowgroup [ref=f1e31]:
            - row [ref=f1e32]:
              - cell "1k input token" [ref=f1e33]
              - cell "Approximately 1,000 input tokens, at least 1,000 answer tokens" [ref=f1e34]
            - row [ref=f1e35]:
              - cell "10k input token" [ref=f1e36]
              - cell "Approximately 10,000 input tokens, at least 1,500 answer tokens (default benchmark on our website)" [ref=f1e37]
            - row [ref=f1e38]:
              - cell "100k input token" [ref=f1e39]
              - cell "Approximately 100,000 input tokens, at least 2,000 answer tokens" [ref=f1e40]
            - row [ref=f1e41]:
              - cell "Vision workload" [ref=f1e42]
              - cell "A single 1 megapixel image and approximately 1,000 input tokens, 1,000 output tokens" [ref=f1e43]
        - paragraph [ref=f1e44]: Longer prompts can result in both longer time to first token and slower output tokens per second compared to shorter prompts.
      - generic [ref=f1e45]:
        - heading [level=3] [ref=f1e46]:
          - link "Load Scenarios" [ref=f1e47] [cursor=pointer]:
            - /url: "#load-scenarios"
        - table [ref=f1e49]:
          - rowgroup [ref=f1e50]:
            - row [ref=f1e51]:
              - columnheader "Load scenario" [ref=f1e52]
              - columnheader "Description" [ref=f1e53]
          - rowgroup [ref=f1e54]:
            - row [ref=f1e55]:
              - cell "Single prompt" [ref=f1e56]
              - cell "One prompt is sent to the model's API at a time" [ref=f1e57]
            - row [ref=f1e58]:
              - cell "Parallel prompts" [ref=f1e59]
              - cell "10 prompts are sent to the model's API simultaneously" [ref=f1e60]
      - generic [ref=f1e61]:
        - heading [level=3] [ref=f1e62]:
          - link "Testing Frequency" [ref=f1e63] [cursor=pointer]:
            - /url: "#testing-frequency"
        - list [ref=f1e64]:
          - listitem [ref=f1e65]: Our 1k, 10k input token and vision workloads are tested 8 times per day, approximately every 3 hours
          - listitem [ref=f1e66]: For our multiple or parallel workload test, we send 10 concurrent requests of our standard 1k input token workload once per day at a random time
          - listitem [ref=f1e67]: Our 100k input token workload is tested once per week
      - generic [ref=f1e68]:
        - heading [level=3] [ref=f1e69]:
          - link "Prompt Generation" [ref=f1e70] [cursor=pointer]:
            - /url: "#prompt-generation"
        - paragraph [ref=f1e71]: Every individual test run uses a unique prompt that we generate at the time of the test and run on all endpoints we cover. Prompts combine a range of long-form input content (e.g., articles) with a range of tasks, including explanation/summarization, question and answer generation, comparative analysis, translation, or visual artifact generation.
        - paragraph [ref=f1e72]: The parameters of the generation process are set to fill the target token budget, producing diverse outputs that test a range of reasoning and generation capabilities.
        - paragraph [ref=f1e73]: Prompt diversity is important for performance benchmarking because techniques like speculative decoding mean that we see variation in output speeds depending on the type of output.
      - generic [ref=f1e74]:
        - heading [level=3] [ref=f1e75]:
          - link "Measurement Representation" [ref=f1e76] [cursor=pointer]:
            - /url: "#measurement-representation"
        - paragraph [ref=f1e77]: Performance measurements are represented as the median (P50) measurement over the past 72 hours to reflect sustained changes in performance that users can expect to experience when using the API. An exception to this is the 100k prompt length workload, which is tested once per week and is represented as the median (P50) measurement over the past 14 days.
    - generic [ref=f1e78]:
      - heading [level=2] [ref=f1e79]:
        - link "Key Definitions" [ref=f1e80] [cursor=pointer]:
          - /url: "#key-definitions"
      - list [ref=f1e81]:
        - listitem [ref=f1e82]:
          - strong [ref=f1e83]: "Time to First Token:"
          - text: The time in seconds between sending a request to the service or system and receiving the first token of the response. For reasoning models which return reasoning tokens, this will be the first reasoning token.
        - listitem [ref=f1e84]:
          - strong [ref=f1e85]: "Time to First Answer Token:"
          - text: The time in seconds between sending a request to the service or system and receiving the first answer token of the response. For reasoning models, this is measured after any 'thinking' time.
        - listitem [ref=f1e86]:
          - strong [ref=f1e87]: "Output Speed (output tokens per second):"
          - text: The average number of tokens received per second, after the first token is received.
        - listitem [ref=f1e88]:
          - strong [ref=f1e89]: "Total Response Time for 100 Output Tokens:"
          - text: The number of seconds to generate 100 output tokens, calculated synthetically based on TTFT and Output Speed to assure maximum comparison utility.
        - listitem [ref=f1e90]:
          - strong [ref=f1e91]: "End-to-End Response Time:"
          - text: The total time to receive a complete response, including input processing time, model reasoning time, and answer generation time.
        - listitem [ref=f1e92]:
          - strong [ref=f1e93]: "Average Reasoning Tokens:"
          - text: "Time reasoning models spend outputting 'reasoning' tokens before providing an answer. This is calculated based on the average number of 'reasoning' tokens across a diverse set of 60 prompts. Where the average number of reasoning tokens is not available or has not yet been calculated, we assume 2k reasoning tokens. These prompts are of varied lengths and include coverage of a range of topics including, personal-related queries, commercial-related queries, coding, math, science and others. Prompts are a combination of being written by Artificial Analysis and others sourced from the following evaluations: MMLU Pro, AIME 2025, and LiveCodeBench. These prompts can be accessed"
          - link "here" [ref=f1e94] [cursor=pointer]:
            - /url: /downloads/methodology/performance-prompts.xlsx
          - text: .
    - generic [ref=f1e95]:
      - heading [level=2] [ref=f1e96]:
        - link "Technical Details" [ref=f1e97] [cursor=pointer]:
          - /url: "#technical-details"
      - paragraph [ref=f1e98]:
        - strong [ref=f1e99]: "Server Location:"
        - text: Our primary testing server is a virtual machine hosted in Google Cloud's
        - code [ref=f1e100]: us-central1-a
        - text: zone.
      - paragraph [ref=f1e101]:
        - strong [ref=f1e102]: "Test Accounts:"
        - text: We conduct tests using a combination of anonymous accounts, accounts with credits, and API keys provided explicitly for benchmarking to undertake testing. Where our primary benchmarking is not undertaken via an anonymous account, we register a separate anonymous account and validate that performance is not being manipulated.
      - paragraph [ref=f1e103]:
        - strong [ref=f1e104]: "API Libraries:"
        - text: For all providers claiming compatibility with OpenAI's API, we use the official OpenAI Python library to ensure consistency across tests. For providers without OpenAI compatibility, we use their recommended client libraries.
      - paragraph [ref=f1e105]:
        - strong [ref=f1e106]: "API Parameters:"
        - text: "We use the following API parameters for all tests:"
      - list [ref=f1e107]:
        - listitem [ref=f1e108]:
          - code [ref=f1e109]: "temperature: 0.6"
          - text: for reasoning models;
          - code [ref=f1e110]: "temperature: 0"
          - text: for non-reasoning models unless specified otherwise by the model creator.
        - listitem [ref=f1e111]:
          - code [ref=f1e112]: "top_p: 1"
      - paragraph [ref=f1e113]:
        - strong [ref=f1e114]: "Token Measurement:"
        - text: "We have two methods for measuring tokens:"
      - list [ref=f1e115]:
        - listitem [ref=f1e116]:
          - text: For performance benchmarking, we measure tokens as counted by OpenAI's tiktoken library (
          - code [ref=f1e117]: o200k_base
          - text: ). This standardizes the number of tokens counted across different models (with different tokenizers) so that the same text is represented as the same number of tokens.
        - listitem [ref=f1e118]: For the Artificial Analysis Intelligence Index evaluations, we instead use the token counts reported by each model's API provider (including cached input, reasoning, and output tokens), which allow us to more accurately report the cost of running the Intelligence Index. When reporting cache hit rates and cost, we combine these with live measurements of each model's typical cache hit rate, rather than relying on the one-off measurement when the evaluation was run.
      - paragraph [ref=f1e119]:
        - strong [ref=f1e120]: "Output Speed Calculation:"
        - text: For reasoning models that do not expose all reasoning tokens in the response, we calculate output speed using the last 80% of answer chunks. This ensures measured output speeds are consistent and more closely reflect user experience.
    - generic [ref=f1e121]:
      - heading [level=2] [ref=f1e122]:
        - link "Known Limitations" [ref=f1e123] [cursor=pointer]:
          - /url: "#known-limitations"
      - paragraph [ref=f1e124]:
        - strong [ref=f1e125]: "Tokenizer Efficiency and Pricing:"
        - text: Different models use different tokenizers, which can lead to differences in the number of tokens required to represent the same text. This means that pricing is not always directly comparable across models. We are working on publishing more details on tokenizer efficiency and its impact on pricing. In the meantime, we have shared some preliminary tokenizer efficiency adjusted pricing analysis on Twitter.
      - paragraph [ref=f1e126]:
        - strong [ref=f1e127]: "Quantization:"
        - text: Some models use quantization techniques to reduce computational requirements and increase speed. However, quantization can also affect model quality. We are moving towards full disclosure of quantization methods used by the models we benchmark.
      - paragraph [ref=f1e128]:
        - strong [ref=f1e129]: "Server Location and TTFT:"
        - text: Time-to-first-token (TTFT) is sensitive to server location as it includes network latency. Our primary testing server is located in Google Cloud's us-central1-a zone, which may advantage or disadvantage certain providers based on their server locations. We are considering adding additional testing locations to mitigate this effect.
    - generic [ref=f1e130]:
      - heading [level=2] [ref=f1e131]:
        - link "Version History" [ref=f1e132] [cursor=pointer]:
          - /url: "#version-history"
      - generic [ref=f1e134]:
        - paragraph [ref=f1e135]:
          - strong [ref=f1e136]: Version 2.2.0
        - paragraph [ref=f1e137]: 2 March 2026
        - list [ref=f1e138]:
          - listitem [ref=f1e139]: "Updated prompts: We've introduced an upgraded set of prompts including broader and more varied content, which include a wider range of task types. This is important because techniques like speculative decoding mean that we see variation in output speeds depending on the type of output."
          - listitem [ref=f1e140]: "Default workload change: Default speed on our site now reflects results from 10k input token prompts (previously 1k) and we have deprecated performance measurements for 100 token input workloads. All 1k, 10k and 100k input token workloads are still visible on all pages by selecting the Prompt Options drop-down. The easiest way to compare output speeds for different workload shapes is using the Output Speed by Input Token Count chart."
    - generic [ref=f1e141]:
      - heading [level=2] [ref=f1e142]:
        - link "Integrity Terms" [ref=f1e143] [cursor=pointer]:
          - /url: "#integrity-terms"
      - generic [ref=f1e144]:
        - heading [level=3] [ref=f1e145]:
          - link "Background" [ref=f1e146] [cursor=pointer]:
            - /url: "#integrity-terms-background"
        - paragraph [ref=f1e147]: Artificial Analysis is an independent AI benchmarking and insights provider. Our benchmarks are widely referenced and consulted by millions of users and organizations.
        - paragraph [ref=f1e148]: We strive to ensure that all data published on Artificial Analysis is fair, transparent, and representative of the typical experience of developers and organizations using the models and endpoints we cover. Our inference benchmarking data is widely used as a reference standard for comparing inference providers across dimensions such as speed, latency, and quality. The value of these measurements depends on them reflecting the experience of an ordinary developer using a provider's standard, publicly available endpoint.
        - paragraph [ref=f1e149]: These terms formalize the approach Artificial Analysis has taken since we began benchmarking inference performance. They apply equally to all inference providers and platforms (together, "providers") that publish serverless endpoint data on Artificial Analysis, and they ensure every provider is measured on the same fair basis.
      - generic [ref=f1e150]:
        - heading [level=3] [ref=f1e151]:
          - link "Provider Requirements" [ref=f1e152] [cursor=pointer]:
            - /url: "#provider-requirements"
        - paragraph [ref=f1e153]: "Traffic from Artificial Analysis must be served on the same publicly available configuration that any ordinary developer would receive when using the endpoint. In particular, providers must not:"
        - list [ref=f1e154]:
          - listitem [ref=f1e155]: Detect, fingerprint, or otherwise identify Artificial Analysis traffic (whether by account, API key, IP address, request headers, payloads, or traffic patterns) and serve it differently from ordinary traffic.
          - listitem [ref=f1e156]: Route Artificial Analysis traffic to dedicated, reserved, or non-public resources, including separate hardware, capacity pools, priority queues, or geographic regions that are not generally available.
          - listitem [ref=f1e157]: Serve Artificial Analysis a model, quantization, context length, or endpoint configuration that differs from what is publicly advertised and generally available under the same name.
          - listitem [ref=f1e158]: Serve Artificial Analysis traffic at a batch size, concurrency, or load configuration that is not representative of what ordinary traffic on the same endpoint receives (for example, running benchmark requests at reduced batch sizes to increase per-request speed).
        - paragraph [ref=f1e159]: On request, providers must confirm the model version, precision or quantization, and context length serving Artificial Analysis traffic, and confirm that this matches the standard public offering. Providers must ensure that every employee, contractor, advisor, or affiliate who is aware that an endpoint is being measured by Artificial Analysis complies with this policy.
        - paragraph [ref=f1e160]: Performance features that are part of the standard public offering and available to all developers on equivalent terms (for example, autoscaling, generally available caching, or published tiering that any customer can access) are not a violation, provided they are not applied selectively to Artificial Analysis traffic.
      - generic [ref=f1e161]:
        - heading [level=3] [ref=f1e162]:
          - link "Compliance Process" [ref=f1e163] [cursor=pointer]:
            - /url: "#compliance-process"
        - paragraph [ref=f1e164]: Artificial Analysis lists endpoints and providers at its sole discretion. We reserve the right to delist any endpoint or provider that does not comply with these terms, and to decline, withhold, or remove any listing for any reason.
        - paragraph [ref=f1e165]: We conduct frequent consistency checks on every endpoint we measure. As standard practice, we measure from our primary Artificial Analysis account alongside independent test accounts, each created and used in the same way an ordinary developer would. Where these return materially different results on identical payloads and the same endpoint, we investigate before drawing conclusions.
        - paragraph [ref=f1e166]: "If we detect or reasonably suspect that Artificial Analysis traffic is being served differently from the standard public offering, we may:"
        - list [ref=f1e167]:
          - listitem [ref=f1e168]: Withhold, remove, or delay publication of affected measurements.
          - listitem [ref=f1e169]: Re-measure on a standard, publicly created account and publish those results.
          - listitem [ref=f1e170]: Remove the endpoint or provider from performance leaderboards and listings.
          - listitem [ref=f1e171]: Suspend the provider across all leaderboards.
          - listitem [ref=f1e172]: Publicly disclose that a provider has served non-representative performance to Artificial Analysis.
        - paragraph [ref=f1e173]: By submitting endpoints to Artificial Analysis, providers acknowledge these terms and our shared commitment to maintaining benchmark integrity. Artificial Analysis may update this policy at any time.
        - paragraph [ref=f1e174]: We appreciate your cooperation in maintaining the integrity of our benchmarks. If you have questions or concerns, please reach out to our team.
