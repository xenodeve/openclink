        - paragraph [ref=e45]: "On this page, and across the Artificial Analysis website, we use the following terms:"
        - list [ref=e46]:
          - listitem [ref=e47]:
            - strong [ref=e48]: "Model:"
            - text: A large language model (LLM), including proprietary, open source and open weights models.
          - listitem [ref=e49]:
            - strong [ref=e50]: "Model Creator:"
            - text: The organization that developed and trained the model. For example, OpenAI is the creator of GPT-4 and Meta is the creator of Llama 3.
          - listitem [ref=e51]:
            - strong [ref=e52]: "Endpoint:"
            - text: A hosted instance of a model that can be accessed via an API. A single model may have multiple endpoints across different providers.
          - listitem [ref=e53]:
            - strong [ref=e54]: "System:"
            - text: A dedicated compute environment for running AI models, typically provisioned infrastructure such as a VM, which can be benchmarked for performance under load.
          - listitem [ref=e55]:
            - strong [ref=e56]: "Provider:"
            - text: A company that hosts and provides access to one or more model endpoints or systems. Examples include OpenAI, AWS Bedrock, Together.ai and more. Companies are often both Model Creators and Providers.
          - listitem [ref=e57]:
            - strong [ref=e58]: "Serverless:"
            - text: Cloud service provided on an as-used basis, in relation to LLM inference APIs generally means priced per token of input and output. Serverless cloud products do still run on servers!
          - listitem [ref=e59]:
            - strong [ref=e60]: "Open Weights:"
            - text: A model whose weights have been released publicly by the model's creator. We refer to 'open weights' or just 'open' models rather than 'open-source' as many open LLMs have been released with licenses that do not meet the full definition of open-source software.
          - listitem [ref=e61]:
            - strong [ref=e62]: "Token:"
            - text: Modern LLMs are built around tokens - numerical representations of words and characters. LLMs take tokens as input and generate tokens as output. Input text is translated into tokens by a tokenizer. Different LLMs use different tokenizers.
          - listitem [ref=e63]:
            - strong [ref=e64]: "OpenAI Tokens:"
            - text: Tokens as generated by OpenAI's GPT-3.5 and GPT-4 tokenizer, generally measured for Artificial Analysis benchmarking with OpenAI's tiktoken package for Python (o200k_base tokenizer). We use OpenAI tokens as a standard unit of measurement across Artificial Analysis to allow fair comparisons between models. All 'tokens per second' metrics refer to OpenAI tokens.
          - listitem [ref=e65]:
            - strong [ref=e66]: "Native Tokens:"
            - text: Tokens as generated by an LLM's own tokenizer. We refer to 'native tokens' to distinguish from 'OpenAI tokens'. Prices generally refer to native tokens.
          - listitem [ref=e67]:
            - strong [ref=e68]: "Price (Input/Output):"
            - text: The price charged by a provider per input token sent to the model and per output token received from the model. Prices shown are the current prices listed by providers.
          - listitem [ref=e69]:
            - strong [ref=e70]: "Price (Blended):"
            - text: To enable easier comparison, we calculate a blended price assuming a 7:2:1 ratio of cache hit, input, and output tokens.
