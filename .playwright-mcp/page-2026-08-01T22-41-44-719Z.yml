          - listitem [ref=e106]:
            - strong [ref=e107]: "Cost per Task:"
            - text: The weighted-average cost (USD) to complete one Artificial Analysis Intelligence Index task. This is calculated by multiplying input, cached, and output token prices by tokens consumed across the workload, weighted by the relative weights of each benchmark in the Intelligence Index, then dividing by task count. Price is either the provider's first-party API rate or the median across all providers. Caching costs differ by provider. Because cost reflects actual token usage, models that produce longer answers or more reasoning tokens will have a higher cost per task, even at identical per-token prices.
