      - heading "Artificial Analysis Benchmarking Methodology" [level=1] [ref=e17]
      - generic [ref=e18]:
        - heading [level=2] [ref=e19]:
          - link "Scope" [ref=e20] [cursor=pointer]:
            - /url: "#scope"
        - paragraph [ref=e21]: Artificial Analysis performs intelligence, quality, performance and price benchmarking on AI models, inference API endpoints and systems. This section of our website describes our benchmarking methodology, including both our quality benchmarking and performance benchmarking.
        - paragraph [ref=e22]: For our language model benchmarking, we note that we consider endpoints to be serverless when customers only pay for their usage, not a fixed rate for access to a system. Typically this means that endpoints are priced on a per token basis, often with different prices for input and output tokens.
        - paragraph [ref=e23]: Across all modalities, our performance benchmarking measures the end-to-end performance experienced by customers of AI inference services and systems. This means that benchmark results are not intended to represent the maximum possible performance on any particular hardware platform, they are intended to represent the real-world performance customers experience across providers.
        - paragraph [ref=e24]: We benchmark both proprietary and open weights models.
