    - generic [ref=f22e239]:
      - heading [level=2] [ref=f22e240]:
        - link "Intelligence Evaluation Principles" [ref=f22e241] [cursor=pointer]:
          - /url: "#intelligence-evaluation-principles"
      - paragraph [ref=f22e242]: "Our evaluation approach is guided by four core principles:"
      - list [ref=f22e243]:
        - listitem [ref=f22e244]:
          - strong [ref=f22e245]: "Standardized:"
          - text: All models are evaluated under identical conditions with consistent prompting strategies, temperature settings, and evaluation criteria.
        - listitem [ref=f22e246]:
          - strong [ref=f22e247]: "Unbiased:"
          - text: We employ evaluation techniques that avoid unfairly penalizing models for answers that correctly follow the instructions in our prompts. This includes using clear prompts, robust answer extraction methods, and flexible answer validation to accommodate valid variations in model outputs.
        - listitem [ref=f22e248]:
          - strong [ref=f22e249]: "Zero-Shot Instruction Prompted:"
          - text: We evaluate using clear instructions without examples or demonstrations, testing models' ability to follow directions without few-shot learning. This approach aligns with modern instruction-tuned and chat style models.
        - listitem [ref=f22e250]:
          - strong [ref=f22e251]: "Transparent:"
          - text: We fully disclose our methodology, including prompt templates, evaluation criteria, and limitations.
    - generic [ref=f22e252]:
      - heading [level=2] [ref=f22e253]:
        - link "General Testing Parameters" [ref=f22e254] [cursor=pointer]:
          - /url: "#general-testing-parameters"
      - paragraph [ref=f22e255]: "We test all evals with the following settings:"
      - list [ref=f22e256]:
        - listitem [ref=f22e257]:
          - strong [ref=f22e258]: "Temperature:"
          - text: 0 for non-reasoning models, 0.6 for reasoning models (unless another temperature is recommended by the model lab)
        - listitem [ref=f22e259]:
          - strong [ref=f22e260]: "Maximum output tokens:"
        - list [ref=f22e261]:
          - listitem [ref=f22e262]: "Non-reasoning models: 16,384 tokens (adjusted downward where models have a smaller context window, or lower maximum output tokens cap)"
          - listitem [ref=f22e263]: "Reasoning models: Maximum output tokens allowed, as disclosed by model creators (custom setting for each reasoning model)"
        - listitem [ref=f22e264]: "Code evaluation environment:"
        - list [ref=f22e265]:
          - listitem [ref=f22e266]: Ubuntu 22.04 LTS
          - listitem [ref=f22e267]: Python 3.12
        - listitem [ref=f22e268]: "Error handling:"
        - list [ref=f22e269]:
          - listitem [ref=f22e270]: Automatic retry on API failures (up to 30 attempts)
          - listitem [ref=f22e271]: All questions that failed all 30 retries are manually reviewed. Results where persistent API failures have caused issues are not published. Errors where all available APIs for proprietary models block a certain question may lower scores (this effect is not material)
        - listitem [ref=f22e272]:
          - text: "Scoring methodology: We generally use pass@1 scoring across our evaluations, where a model must produce the correct answer on its first attempt. For evaluations with multiple repeats, pass@1 is calculated by aggregating results across all repeats. This is calculated as:where p"
          - subscript [ref=f22e273]: i
          - text: = 1 if attempt i is correct, 0 otherwise, and k is the total number of test instances across all repeats.
      - paragraph [ref=f22e274]: We maintain internal copies of all evaluation datasets. The sources of our selected datasets are listed below.
      - paragraph [ref=f22e275]:
        - text: For the Artificial Analysis Intelligence Index evaluations, we use the token counts reported by each model's API provider, to accurately report the cost of running the Intelligence Index. This contrasts with the approach in performance benchmarking, where we use client-side token counts from the
        - code [ref=f22e276]: o200k_base
        - text: tokenizer to standardize token counts for the same text across models. When reporting cache hit rates and cost, we combine provider token counts with live measurements of the model's typical cache hit rate, rather than relying on the one-off measurement when the evaluation was run.
    - generic [ref=f22e277]:
      - heading [level=2] [ref=f22e278]:
        - link "Artificial Analysis Intelligence Index Evaluations" [ref=f22e279] [cursor=pointer]:
          - /url: "#intelligence-index-evaluations"
      - paragraph [ref=f22e280]: Evaluations that make up the current Artificial Analysis Intelligence Index, grouped by capability.
      - generic [ref=f22e281]:
        - heading [level=3] [ref=f22e282]:
          - link "Agents" [ref=f22e283] [cursor=pointer]:
            - /url: "#agents"
        - generic [ref=f22e284]:
          - heading [level=4] [ref=f22e285]:
            - link "GDPval-AA v2" [ref=f22e286] [cursor=pointer]:
              - /url: "#gdpval-aa"
          - list [ref=f22e287]:
            - listitem [ref=f22e288]:
              - strong [ref=f22e289]: "Description:"
              - text: GDPval-AA v2 is Artificial Analysis' evaluation framework for OpenAI's GDPval dataset. It assesses language models' capabilities on economically valuable tasks, covering 44 occupations across key sectors contributing to GDP in the United States.
            - listitem [ref=f22e290]:
              - strong [ref=f22e291]: "Changes from GDPval-AA v1:"
              - text: "GDPval-AA v2 is a minor upgrade to the original GDPval-AA methodology used in Intelligence Index v4.0. It incorporates:"
              - list [ref=f22e292]:
                - listitem [ref=f22e293]: An upgraded sandbox with new and expanded dependencies, plus fixes to minor environment issues and to prompt clarity and consistency
                - listitem [ref=f22e294]: Elo scores re-baselined to human expert performance at 1000
                - listitem [ref=f22e295]: A panel of three frontier LLM judges from leading labs, replacing a single judge
                - listitem [ref=f22e296]: Turn limits expanded to 250 turns to allow for even longer-horizon agent trajectories, and the ability for models to exit early where they don't believe they can complete the task
            - listitem [ref=f22e297]:
              - strong [ref=f22e298]: "Paper:"
              - link "https://arxiv.org/abs/2510.04374" [ref=f22e299] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2510.04374
            - listitem [ref=f22e300]:
              - strong [ref=f22e301]: "Agent harness:"
              - link "https://github.com/ArtificialAnalysis/Stirrup" [ref=f22e302] [cursor=pointer]:
                - /url: https://github.com/ArtificialAnalysis/Stirrup
            - listitem [ref=f22e303]:
              - strong [ref=f22e304]: "Dataset:"
              - list [ref=f22e305]:
                - listitem [ref=f22e306]:
                  - text: We base our evaluation on the public gold OpenAI GDPval dataset from
                  - link "https://huggingface.co/datasets/openai/gdpval" [ref=f22e307] [cursor=pointer]:
                    - /url: https://huggingface.co/datasets/openai/gdpval
                - listitem [ref=f22e308]: Some Microsoft Office files in the dataset had missing metadata parts or malformed relationship entries that prevented LibreOffice from opening them. We added the minimal missing metadata and fixed the malformed entries to ensure compatibility. Document body, slide content, and layout were not changed.
            - listitem [ref=f22e309]:
              - strong [ref=f22e310]: "Implementation:"
              - text: "This evaluation comprises two stages:"
              - list [ref=f22e311]:
                - listitem [ref=f22e312]:
                  - strong [ref=f22e313]: Task Submission
                  - text: – Models are given a task and required to produce one or more files.
                - listitem [ref=f22e314]:
                  - strong [ref=f22e315]: Pairwise Grading
                  - text: – A judge sampled from a panel of three frontier LLM judges blindly ranks two submissions for the same task, each created by a different model.
                - listitem [ref=f22e316]:
                  - strong [ref=f22e317]: "Elo Calculation:"
                  - text: After collecting pairwise rankings, we fit them to a Bradley-Terry model via maximum likelihood estimation and compute confidence intervals using the sandwich estimator to establish our final Elo metric. The Elo scale is anchored to human expert deliverables at 1000.
                - listitem [ref=f22e318]:
                  - strong [ref=f22e319]: "Intelligence Index Integration:"
                  - text: For inclusion in the Intelligence Index, GDPval-AA v2 Elo scores are frozen at the time of a model's addition and normalized as clamp((Elo - 500) / 2000) for inclusion in the Intelligence Index. The v2 Elo scale is anchored to human expert deliverables at 1000, while the fixed normalization range preserves stable Intelligence Index contributions over time. Artificial Analysis may update the reference parameters as models progress against the evaluation, to maintain meaningful differentiation in the Intelligence Index.
            - listitem [ref=f22e320]:
              - strong [ref=f22e321]: "Task Submission Details:"
              - list [ref=f22e322]:
                - listitem [ref=f22e323]:
                  - text: All models are run using our open source agentic harness,
                  - link "Stirrup" [ref=f22e324] [cursor=pointer]:
                    - /url: https://github.com/ArtificialAnalysis/Stirrup
                  - text: ". Within the harness, models are given a code execution environment (E2B sandbox), and the following six tools to call at their discretion:"
                  - list [ref=f22e325]:
                    - listitem [ref=f22e326]:
                      - strong [ref=f22e327]: Web Fetch
                      - text: – Fetches and extracts main content from a web page as markdown.
                    - listitem [ref=f22e328]:
                      - strong [ref=f22e329]: Web Search
                      - text: – Searches the web using Brave Search API; returns the top 5 results with title, URL, and description.
                    - listitem [ref=f22e330]:
                      - strong [ref=f22e331]: View Image
                      - text: – Reads and displays image files (.png, .jpg, .jpeg) from the sandbox as native image tokens for LLM consumption. This tool is only exposed to models with vision support. Images are downscaled to a maximum of 1 megapixel before being sent to the model.
                    - listitem [ref=f22e332]:
                      - strong [ref=f22e333]: Code Exec
                      - text: – Executes bash commands in the sandbox via the
                      - code [ref=f22e334]: code_exec
                      - text: tool; returns exit code, stdout, and stderr.
                    - listitem [ref=f22e335]:
                      - strong [ref=f22e336]: Finish
                      - text: – Signals task completion and specifies which files to submit.
                    - listitem [ref=f22e337]:
                      - strong [ref=f22e338]: Abandon Task
                      - text: – Signals that the model does not believe it can complete the task, with a brief reason, instead of submitting files.
                - listitem [ref=f22e339]:
                  - text: For each task, a new E2B sandbox is initialized with the reference files associated with the given task and pre-installed with a range of relevant packages for the task set. We based the package collection on the disclosed environment from the original GDPval paper, expanded in v2 with additional dependencies (including a full TeX Live LaTeX toolchain and build tools).
                  - list [ref=f22e340]:
                    - listitem [ref=f22e341]:
                      - generic [ref=f22e343]:
