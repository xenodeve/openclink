            - list [ref=f22e2243]:
              - listitem [ref=f22e2244]: The 'telecom' domain introduced in 𝜏²-Bench contains 114 tasks (subsampled from a total 2,285 programmatically generated tasks), with varying 'intents' describing if the task is related to service, mobile data, or MMS issues. We evaluate the telecom domain in full with 3 repeats per task, and report the score using pass@1 scoring as the average of the 3 attempts
              - listitem [ref=f22e2245]: In this benchmark, the outcome 'world state' decides whether the agent succeeded - for example, whether the user's cell phone data is functioning after the agent completes the task
              - listitem [ref=f22e2246]: The full 𝜏²-Bench suite includes 3 execution modes with varying planning and communication levels in ablation studies; we implement the 'default' dual control mode with fully simulated and separate user and assistant agents
              - listitem [ref=f22e2247]: We use Qwen3 235B A22B 2507 (Non-reasoning) for the user agent simulator to ensure consistent checkpoint availability and full control over inference settings alongside strong base intelligence
              - listitem [ref=f22e2248]: We apply a constraint on execution to limit steps to a maximum of 100 per task repeat
