          - list [ref=f22e1669]:
            - listitem [ref=f22e1670]:
              - strong [ref=f22e1671]: "Description:"
              - text: AA-Omniscience is a knowledge and hallucination benchmark that measures factual reliability, rewards precise knowledge, and penalizes incorrect guesses or hallucinations. It provides a detailed assessment of a model’s ability to distinguish known from unknowns across diverse knowledge domains.
            - listitem [ref=f22e1672]:
              - strong [ref=f22e1673]: "Dataset:"
              - link "https://huggingface.co/datasets/ArtificialAnalysis/AA-Omniscience-Public" [ref=f22e1674] [cursor=pointer]:
                - /url: https://huggingface.co/datasets/ArtificialAnalysis/AA-Omniscience-Public
            - listitem [ref=f22e1675]:
              - strong [ref=f22e1676]: "Implementation:"
              - list [ref=f22e1677]:
                - listitem [ref=f22e1678]:
                  - text: The benchmark consists of 6,000 questions covering 42 topics, including
                  - emphasis [ref=f22e1679]: Business
                  - text: ","
                  - emphasis [ref=f22e1680]: Humanities and Social Sciences
                  - text: ","
                  - emphasis [ref=f22e1681]: Health
                  - text: ","
                  - emphasis [ref=f22e1682]: Law
                  - text: ","
                  - emphasis [ref=f22e1683]: Software Engineering
                  - text: ", and"
                  - emphasis [ref=f22e1684]: Science, Engineering and Mathematics
                  - text: .
                - listitem [ref=f22e1685]:
                  - text: Models are scored using the
                  - emphasis [ref=f22e1686]: AA-Omniscience Index
                  - text: ", which assigns points for correct answers, subtracts points for hallucinated responses, and keeps abstentions neutral, rewarding abstentions over incorrect guesses"
                - listitem [ref=f22e1687]:
                  - text: Each answer is graded as either
                  - code [ref=f22e1688]: CORRECT
                  - text: ","
                  - code [ref=f22e1689]: INCORRECT
                  - text: ","
                  - code [ref=f22e1690]: PARTIALLY_CORRECT
                  - text: ", or"
                  - code [ref=f22e1691]: NOT_ATTEMPTED
                  - text: based on the model's response and the ground truth answer. Gemini 3 Flash Preview (Reasoning) is used as the grading model
                - listitem [ref=f22e1692]:
                  - strong [ref=f22e1693]: "Intelligence Index Integration:"
                  - text: "AA-Omniscience contributes two components to the Intelligence Index: (1)"
                  - emphasis [ref=f22e1694]: Accuracy
                  - text: "- the proportion of correct answers, weighted at 8% of the overall Index, and (2)"
                  - emphasis [ref=f22e1695]: Non-Hallucination Rate
                  - text: "- calculated as 1 minus the hallucination rate, weighted at 4% of the overall Index (a 2:1 split of AA-Omniscience's 12% share)."
