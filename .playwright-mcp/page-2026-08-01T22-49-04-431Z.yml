        - code [ref=f22e2346]: "Assess whether the following CANDIDATE ANSWER is CORRECT or INCORRECT. For the CANDIDATE ANSWER to be correct, it must be consistent with the OFFICIAL ANSWER. The question, for reference only: {question} The OFFICIAL ANSWER: {official_answer} CANDIDATE ANSWER TO ASSESS: {candidate_answer} Reply only with CORRECT or INCORRECT."
