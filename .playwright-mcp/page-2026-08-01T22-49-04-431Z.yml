                  - paragraph [ref=f22e1550]: System packages are the full pinned transitive closure resolved inside the Debian trixie base image, so most entries are dependencies of the packages we install directly
                - listitem [ref=f22e1551]: We prompt the agent with an instruction interpolating the relevant task prompt, reference files, and finish tool details.
          - list [ref=f22e1552]:
            - listitem [ref=f22e1553]:
              - strong [ref=f22e1554]: "Execution Limits:"
              - list [ref=f22e1555]:
                - listitem [ref=f22e1556]: The LLM is given 250 turns to complete the task. A single turn is defined as an assistant message and its tool calls (if any). As the model approaches the limit, it is notified of its remaining turn budget.
                - listitem [ref=f22e1557]: The model may end the run early via the Abandon Task tool where it does not believe it can complete the task, providing a brief reason instead of submitting files.
                - listitem [ref=f22e1558]: If the model exceeds 70% of its context window after completing a given turn, the agent asks it to summarize task state, completed work, current files, remaining steps, and important context, then clears earlier turn history while retaining the task prompt and the summary for continuation.
          - paragraph [ref=f22e1559]:
            - strong [ref=f22e1560]: "Task Submission System Prompt:"
          - code [ref=f22e1562]: "You are an AI agent completing a standalone professional task. Your job is to use the provided tools to produce the requested deliverables within 250 steps, then submit your work. When you are done, call the `finish` tool as your final step with: 1. A brief summary of what you accomplished. 2. Absolute paths to every deliverable file. If you have genuinely concluded that the task cannot be completed because required inputs are missing, a hard dependency is unavailable, or the request is incoherent, call the `abandon_task_finish` tool with a brief reason instead. Do not use it to escape difficulty. You cannot interact with the user during the task. Make reasonable assumptions when needed and record them in your finish summary."
          - paragraph [ref=f22e1563]:
            - strong [ref=f22e1564]: "Task Submission Prompt:"
          - code [ref=f22e1566]: "## Runtime You are running in an isolated Linux sandbox. Use the `code_exec` tool to read, create, and modify files. Commands run as the non-root user `user` (UID 1000). Default working directory is `/home/user`. Every command runs independently: no working directory, environment variable, or other shell state carries over from one call to the next. Prefer absolute paths for both files and commands, and do not navigate with `cd` across calls — a `cd` in one command is gone by the next, so relying on it leaves you silently operating in the wrong place. When a step genuinely needs a different directory, chain it into the same command (e.g. `cd /home/user/work && python build.py`). A broad scientific-computing and document-processing stack is already installed, so confirm what is present before assuming a gap: - Python 3.13 with the usual data stack (numpy, pandas, polars, scipy), plotting (matplotlib, plotly), the scikit-learn ML family, and document tooling (python-docx, python-pptx, openpyxl, PyMuPDF, pdfplumber, reportlab, weasyprint, Pillow, opencv), plus Playwright. - System tools include LibreOffice, Pandoc, Tesseract, FFmpeg, ImageMagick, Ghostscript, TeX Live, OpenJDK, Chromium, jq, and git. - Commands are terminated after 10 minutes. Keep them bounded, persist intermediate results to disk, and split long jobs into smaller steps. ## Reference Files Location (This section appears only when the task includes reference files.) The reference files for the task are available in your environment's file system. Here are their paths: - [absolute path to each reference file] ## Completing Your Work In order to complete the task you must use the `finish` tool to submit your work. If you do not use the `finish` tool you will fail this task! As a last resort if you really cannot make any meaningful progress, use `abandon_task_finish` with a brief reason instead of submitting files. **Required in your finish call:** 1. A brief summary of what you accomplished 2. A list of **ABSOLUTE file paths** for the required output files (Do not submit folders). ## Task Here is the task you need to complete: [task description] Please begin working on the task now."
          - list [ref=f22e1567]:
            - listitem [ref=f22e1568]:
              - strong [ref=f22e1569]: "Context Overflow:"
              - text: If the next model call (or the summarization request itself) exceeds the context window, the agent keeps unwinding earlier turns until summarization succeeds.
            - listitem [ref=f22e1570]:
              - strong [ref=f22e1571]: "Task Completion:"
              - text: To complete the task, the LLM must call the finish tool, providing a summary of the work done and the paths of the files it intends to submit. This tool can be used at any turn.
            - listitem [ref=f22e1572]:
              - strong [ref=f22e1573]: "Grading:"
              - text: "We sample pairwise matches between model submissions in two stages:"
              - list [ref=f22e1574]:
                - listitem [ref=f22e1575]:
                  - strong [ref=f22e1576]: "Balanced sampling:"
                  - text: We first sample each model diversely, balancing exposure across tasks, judges, and opponents, to seed initial ratings.
                - listitem [ref=f22e1577]:
                  - strong [ref=f22e1578]: "Active sampling:"
                  - text: After the initial phase, we transition to Elo-informed sampling that prioritizes pairings between models with similar ratings to derive the most information per comparison. We maintain balanced exposure of tasks within each model throughout the process.
                - listitem [ref=f22e1579]: Submissions are randomly anonymized as Submission A and B to mitigate any model or position bias from the grader model.
                - listitem [ref=f22e1580]: "Matches are graded by a panel of three frontier LLM judges from leading labs, each run at its default reasoning settings: GPT-5.5 (medium reasoning), Gemini 3.1 Pro Preview (high reasoning), and Claude Opus 4.8 (high effort). We sample between the judges for each comparison. The initial task, all reference files, and all submission files are parsed and provided as context to the judge."
                - listitem [ref=f22e1581]: Document-based files (.pdf, .docx, .pptx, .xlsx, etc.) are parsed as both text and as images. We extract .zip files and parse each individual file separately. For tasks containing audio or video files, the comparison is routed to Gemini 3.1 Pro Preview, which handles these modalities natively. This context is embedded in a grading prompt that asks the judge to determine which of Submission A and B better responds to the task.
                - listitem [ref=f22e1582]: "Final Scoring: Our final Elo score is a Bradley-Terry rating computed via maximum likelihood estimation from all pairwise comparisons (ties counted as half-wins for each side), anchored to human expert deliverables at 1,000 — re-baselining the scale to human performance. The 95% confidence intervals are computed using the sandwich estimator to quantify rating uncertainty."
