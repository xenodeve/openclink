      - generic [ref=f22e2281]:
        - heading [level=3] [ref=f22e2282]:
          - link "Multiple Choice Questions (GPQA, MMLU-Pro)" [ref=f22e2283] [cursor=pointer]:
            - /url: "#multiple-choice-questions"
        - paragraph [ref=f22e2284]: We prompt multi-choice evals with the following instruction prompt. This prompt was independently developed by Artificial Analysis, and carefully validated with various ablation studies. We assess that this prompt is a clearer, and therefore fairer, approach than traditional completion-style multi-choice evaluation methodologies or other instruction prompts we tested.
        - paragraph [ref=f22e2285]: GPQA uses four options (A–D). MMLU-Pro uses ten options (A–J); we use the same structure with additional choices.
        - code [ref=f22e2287]: "Answer the following multiple choice question. The last line of your response should be in the following format: 'Answer: A/B/C/D' (e.g. 'Answer: A'). {Question} A) {A} B) {B} C) {C} D) {D}"
        - code [ref=f22e2289]: "Answer the following multiple choice question. The last line of your response should be in the following format: 'Answer: A/B/C/D/E/F/G/H/I/J' (e.g. 'Answer: A'). {Question} A) {A} B) {B} C) {C} D) {D} E) {E} F) {F} G) {G} H) {H} I) {I} J) {J}"
      - generic [ref=f22e2290]:
        - heading [level=3] [ref=f22e2291]:
          - link "Multiple Choice Extraction Regex" [ref=f22e2292] [cursor=pointer]:
            - /url: "#multiple-choice-extraction-regex"
        - paragraph [ref=f22e2293]: "We extract multiple choice answers using a multi-stage approach to handle various answer formats. For single-letter responses, we use the letter directly. Otherwise, we first attempt to match our primary pattern that looks for formal \"Answer: X\" format (accounting for optional markdown formatting):"
        - generic [ref=f22e2294]:
          - paragraph [ref=f22e2295]: "Primary Pattern:"
          - code [ref=f22e2297]: "(?i)[\\*\\_]{0,2}Answer[\\*\\_]{0,2}\\s*:[\\s\\*\\_]{0,2}\\s*([A-Z])(?![a-zA-Z0-9])"
        - paragraph [ref=f22e2298]: "If the primary pattern fails, we attempt the following fallback patterns in sequence to catch various answer formats:"
        - list [ref=f22e2299]:
          - listitem [ref=f22e2300]:
            - text: "LaTeX boxed notation (e.g., \\boxed{A} or \\boxed{The answer is A})"
            - code [ref=f22e2302]: "\\boxed\\{[^}]*([A-Z])[^}]*\\}"
          - listitem [ref=f22e2303]:
            - text: Natural language (e.g., "answer is B")
            - code [ref=f22e2305]: answer is ([a-zA-Z])
          - listitem [ref=f22e2306]:
            - text: With parenthesis (e.g., "answer is (C")
            - code [ref=f22e2308]: answer is \\(([a-zA-Z])
          - listitem [ref=f22e2309]:
            - text: Choice format (e.g., "D) some answer text")
            - code [ref=f22e2311]: ([A-Z])\)\s*[^A-Z]*
          - listitem [ref=f22e2312]:
            - text: Explicit statement (e.g., "E is the correct answer")
            - code [ref=f22e2314]: ([A-Z])\s+is\s+the\s+correct\s+answer
          - listitem [ref=f22e2315]:
            - text: Standalone letter at end of response
            - code [ref=f22e2317]: ([A-Z])\s*$
          - listitem [ref=f22e2318]:
            - text: Letter followed by period (e.g., "F.")
            - code [ref=f22e2320]: ([A-Z])\s*\.
          - listitem [ref=f22e2321]:
            - text: Letter followed by non-word character
            - code [ref=f22e2323]: ([A-Z])\s*[^\w]
        - paragraph [ref=f22e2324]: We always take the last match found to account for self-correction in responses.
      - generic [ref=f22e2325]:
        - heading [level=3] [ref=f22e2326]:
          - link "Equality Checker LLM" [ref=f22e2327] [cursor=pointer]:
            - /url: "#equality-checker-llm"
        - paragraph [ref=f22e2328]: For evaluations with open-ended answers (HLE, AA-LCR), we use an equality checker LLM to determine if a model's response is semantically equivalent to the correct answer. This approach uses a language model to assess whether two answers have the same meaning, even if phrased differently. The equality checker evaluates semantic equivalence rather than requiring exact string matches, which is particularly important for questions where multiple valid phrasings exist.
        - paragraph [ref=f22e2329]: Different evaluations use different models as equality checkers, selected based on validation against human judgement. Specific equality checker prompts for each evaluation are detailed in the sections below.
      - generic [ref=f22e2330]:
        - heading [level=3] [ref=f22e2331]:
          - link "HLE (Humanity's Last Exam)" [ref=f22e2332] [cursor=pointer]:
            - /url: "#hle-prompt"
        - paragraph [ref=f22e2333]: We prompt HLE with the following text as a system prompt, with a difference between Exact Answer and Multiple Choice questions - these prompts are used with no changes from the original implementation by Hendrycks et al. For models that do not support a system prompt, we prepend the system prompt to the user prompt.
        - code [ref=f22e2335]: "System Prompt for Exact Answer Questions: \"Your response should be in the following format: Explanation: {your explanation for your final answer} Exact Answer: {your succinct, final answer} Confidence: {your confidence score between 0% and 100% for your answer}\" System Prompt for Multiple Choice Questions: \"Your response should be in the following format: Explanation: {your explanation for your answer choice} Answer: {your chosen answer} Confidence: {your confidence score between 0% and 100% for your answer}\""
      - generic [ref=f22e2336]:
        - heading [level=3] [ref=f22e2337]:
          - link "HLE Equality Checker Prompt" [ref=f22e2338] [cursor=pointer]:
            - /url: "#hle-equality-checker-prompt"
        - paragraph [ref=f22e2339]: We use the following prompt on GPT-4o (Aug 2024) to check if the response answer is correct - this prompt is again used with no changes from the original implementation by Hendrycks et al.
        - code [ref=f22e2341]: "Judge whether the following [response] to [question] is correct or not based on the precise and unambiguous [correct_answer] below. [question]: {question} [response]: {response} Your judgement must be in the format and criteria specified below: extracted_final_answer: The final exact answer extracted from the [response]. Put the extracted answer as 'None' if there is no exact, final answer to extract from the response. [correct_answer]: {correct_answer} reasoning: Explain why the extracted_final_answer is correct or incorrect based on [correct_answer], focusing only on if there are meaningful differences between [correct_answer] and the extracted_final_answer. Do not comment on any background to the problem, do not attempt to solve the problem, do not argue for any answer different than [correct_answer], focus only on whether the answers match. correct: Answer 'yes' if extracted_final_answer matches the [correct_answer] given above, or is within a small margin of error for numerical problems. Answer 'no' otherwise, i.e. if there if there is any inconsistency, ambiguity, non-equivalency, or if the extracted answer is incorrect. confidence: The extracted confidence score between 0|\\%| and 100|\\%| from [response]. Put 100 if there is no confidence score available."
      - generic [ref=f22e2342]:
