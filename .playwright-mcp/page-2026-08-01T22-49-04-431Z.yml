        - generic [ref=f22e1771]:
          - heading [level=4] [ref=f22e1772]:
            - link "AA-Briefcase" [ref=f22e1773] [cursor=pointer]:
              - /url: "#aa-briefcase"
          - list [ref=f22e1774]:
            - listitem [ref=f22e1775]:
              - strong [ref=f22e1776]: "Description:"
              - text: AA-Briefcase is a new benchmark for testing models on realistic knowledge work tasks in complex projects built by industry experts. Models are evaluated on multi-week knowledge work projects, each with many linked tasks and thousands of input source files. AA-Briefcase combines rubric and pairwise grading to evaluate verifiable task success, analytical quality, and presentation quality, giving a holistic view of overall agentic capability in knowledge work.
            - listitem [ref=f22e1777]:
              - strong [ref=f22e1778]: "Example dataset:"
              - link "https://huggingface.co/datasets/ArtificialAnalysis/AA-Briefcase-Lite" [ref=f22e1779] [cursor=pointer]:
                - /url: https://huggingface.co/datasets/ArtificialAnalysis/AA-Briefcase-Lite
            - listitem [ref=f22e1780]:
              - strong [ref=f22e1781]: "Agent harness:"
              - link "https://github.com/ArtificialAnalysis/Stirrup" [ref=f22e1782] [cursor=pointer]:
                - /url: https://github.com/ArtificialAnalysis/Stirrup
            - listitem [ref=f22e1783]:
              - strong [ref=f22e1784]: "Implementation:"
              - list [ref=f22e1785]:
                - listitem [ref=f22e1786]: Each AA-Briefcase scenario is a realistic multi-week business problem, organized as a multi-week workflow that the agent works through in sequence, with 2-5 tasks per week. Although tasks within a scenario share files and context across weeks, models currently complete each task in an independent run, without carrying over their own prior submissions. The agent receives the task description and accessible source files, then produces final deliverable files without live interaction or iterative feedback during execution.
                - listitem [ref=f22e1787]: Scenario source pools include shared files and week-specific files, mixing real, augmented, and synthetic materials. Source files are designed to include realistic professional artifacts such as Slack exports, spreadsheets, PDFs, interview transcripts, market research, standards documents, app-store pages, board materials, emails, and other business records. Later-week tasks may receive standardized base-case files (the same reference work products given to every model), so each task stays independently runnable while preserving continuity across the week.
                - listitem [ref=f22e1788]:
                  - text: Model submissions are run with
                  - link "Stirrup" [ref=f22e1789] [cursor=pointer]:
                    - /url: https://github.com/ArtificialAnalysis/Stirrup
                  - text: in a week-scoped E2B sandbox.
                  - list [ref=f22e1790]:
                    - listitem [ref=f22e1791]:
                      - strong [ref=f22e1792]: "Turns:"
                      - text: Agents run for up to 500 turns per task.
                    - listitem [ref=f22e1793]:
                      - strong [ref=f22e1794]: "Tools:"
                      - text: The agent is given a single code-execution tool that runs shell commands and code inside the sandbox, plus the finish tools below (and a view-image tool when the model supports vision). The sandbox has no internet access, so the agent can only use the provided source files.
                    - listitem [ref=f22e1795]:
                      - strong [ref=f22e1796]: "Sandbox:"
                      - text: Each scenario/week sandbox is built from that week's source files, with standard Python packages and system tools for document processing and scientific computing pre-installed.
                    - listitem [ref=f22e1797]:
                      - strong [ref=f22e1798]: "Finish tools:"
                      - text: A finish tool, which the agent calls to submit a summary and the absolute paths of its deliverables (validated to be actual files, not directories or missing paths), and an abandon_task_finish (give-up) tool, which it calls with a reason only when it concludes the task is genuinely impossible.
                - listitem [ref=f22e1799]:
                  - strong [ref=f22e1800]: "Prompts:"
                  - text: "The prompts used across generation and grading:"
                  - list [ref=f22e1801]:
                    - listitem [ref=f22e1802]:
                      - strong [ref=f22e1803]: "Agent system prompt:"
                      - code [ref=f22e1805]: "You are an AI agent working on a specific task within a multi-week simulated workplace scenario. Each task is part of a longer workflow; your job is to complete the current task using the tools provided in up to 500 steps, then submit your deliverables. When you are done you must call the `finish` tool as your final step, passing a brief summary of what you accomplished and a list of absolute paths for every deliverable file. If you have genuinely concluded that the task cannot be completed — for example because required inputs are missing, a hard dependency is unavailable, or the request itself is incoherent — call the `abandon_task_finish` tool with a brief reason instead. Do not use it to escape difficulty. You cannot interact with the user during the task. Record any clarifying assumptions you made in your finish summary."
                    - listitem [ref=f22e1806]:
                      - strong [ref=f22e1807]: "Agent task prompt:"
                      - code [ref=f22e1809]: "<execution_context> ## Sandbox You operate inside an isolated Linux container through the `code_exec` tool, which runs shell commands and lets you read, create, and edit files. Commands run as the unprivileged user `user` (UID 1000), starting from `/home/user`. Passwordless `sudo` exists but is rarely needed, since your home directory is fully writable. Every command runs independently: no working directory, environment variable, or other shell state carries over from one call to the next. Prefer absolute paths for both files and commands, and do not navigate with `cd` across calls — a `cd` in one command is gone by the next, so relying on it leaves you silently operating in the wrong place. When a step genuinely needs a different directory, chain it into the same command (e.g. `cd /home/user/work && python build.py`). ## No network The container has no outbound connectivity, and there is no proxy, allowlist, or flag that can turn it on — treat the environment as permanently offline. Anything that reaches for the internet will fail, including package installs (`pip`, `npm`, `apt`), remote `git` operations, and any HTTP/HTTPS client request from any language. Identify a network block by its error signature rather than by guessing: failed name resolution (`Could not resolve host`, `Temporary failure in name resolution`), an unreachable route (`Network is unreachable`, a refused or timed-out connection to a public host), or a stalled TLS handshake. When you see these, the failure is structural — do not retry the same call and do not hunt for a workaround (mirrors, alternate hosts, cached copies). Re-plan using only what is already installed and what ships inside your workspace. ## Filesystem - Writable: everything under `/home/user/` plus `/tmp`. Use these for deliverables, intermediate files, and caches. - Read-only inputs: - `/home/user/shared/` — reference material shared across the whole scenario - `/home/user/week/` — documents specific to this week's tasks Copy these into a working folder before transforming them rather than editing them in place. ## Runtime A broad scientific-computing and document-processing stack is already installed, so confirm what is present before assuming a gap: - Python 3.13 with the usual data stack (numpy, pandas, polars, scipy), plotting (matplotlib, plotly), the scikit-learn ML family, and document tooling (python-docx, python-pptx, openpyxl, PyMuPDF, pdfplumber, reportlab, weasyprint, Pillow, opencv), plus Playwright. - System tools include LibreOffice, Pandoc, Tesseract, FFmpeg, ImageMagick, Ghostscript, TeX Live, OpenJDK, Chromium, jq, and git. - Check availability with `pip show <pkg>` or `which <tool>` instead of installing — installs fail offline, but almost anything you would reach for is already here. - matplotlib runs headless (`MPLBACKEND=Agg`): write figures to files; never call `plt.show()`. - Commands are terminated after 20 minutes. Keep them bounded, persist intermediate results to disk, and split long jobs into smaller steps. ## Submitting your work Finish by calling the `finish` tool — anything not submitted through it is not graded. Your call must include: 1. A short summary of what you accomplished. 2. Absolute paths to every deliverable (files only, not folders). Save each deliverable directly in `/home/user` under the exact filename the task asks for — not in a subdirectory. Save deliverables as ordinary, visible files. Do not leave the only copy of your work in a dot-prefixed file or directory (e.g. `.submission.txt`, `.outputs/report.md`), including inside an archive; a `.zip` is fine when the task explicitly asks for one. Assume your files will be opened and edited by others after submission, so write them to last. If the task genuinely cannot be completed, call the `abandon_task_finish` tool with a brief reason instead. Use it only when you have concluded the work is impossible — not to escape a difficult task. </execution_context> <scenario_overview> {scenario_overview} </scenario_overview> <week_overview> {week_overview} </week_overview> <task_description> {task} </task_description> <deliverables> Submit these files, by exact name, saved directly in `/home/user`: {expected_output_filenames} </deliverables> Please begin working on the task now."
                    - listitem [ref=f22e1810]:
                      - strong [ref=f22e1811]: "Binary rubric grading prompt:"
                      - code [ref=f22e1813]: "You are grading a submitted deliverable against one binary rubric check. The user message contains: - the task instructions, - the rubric item, - the submitted artifact content. Submitted artifacts may appear as text blocks, image blocks, or parser notes for unsupported content. Use only evidence from the submitted artifact content. Do not infer facts from filenames, task instructions, or rubric text unless the submitted artifact content supports them. Beyond the task instructions and rubric in the user message, you only ever receive the submitted artifact itself, never the external source files it cites. Do not fail an item merely because you cannot open or cross-check a cited source — judge citations on whether they are present, specific, and well-formed in the submission, not on whether the source's contents can be independently confirmed. Return a strict binary judgment: - passed=true only if the pass criteria are satisfied. - passed=false if any required element is missing, materially wrong, unsupported, or not evidenced. Write concise reasoning that cites submitted artifact evidence or the absence of evidence. Do not award partial credit."
                - listitem [ref=f22e1814]:
                  - text: Each task is graded against two styles of checks.
                  - strong [ref=f22e1815]: Rubric checks
                  - text: are binary pass/fail criteria scored against a single submission.
                  - strong [ref=f22e1816]: Pairwise checks
                  - text: "compare two submissions for the same task and return a preferred submission or tie. There are two kinds:"
                  - emphasis [ref=f22e1817]: Analytical Quality
                  - text: (which output has deeper, better-structured analysis) and
                  - emphasis [ref=f22e1818]: Presentation
                  - text: (which output is more professionally presented).
                - listitem [ref=f22e1819]: "All grading and pairwise comparisons are decided by one of a panel of three judges (Claude Opus 4.8 (max), GPT-5.5 (xhigh), and Gemini 3.1 Pro Preview) rather than a single judge, reducing bias toward submissions from the same model or model family. Each rubric verdict and pairwise comparison is decided by one judge sampled from the panel, with sampling balanced across checks and matches. To keep results comparable, a given rubric check is always graded by the same judge. AA-Briefcase Elo is the headline metric of this evaluation: it aggregates analytical quality Elo, presentation Elo, and rubric pass rate, with rubric performance converted into Elo via synthetic head-to-head matches using a maximum-likelihood Elo aggregation."
        - generic [ref=f22e1820]:
          - heading [level=4] [ref=f22e1821]:
            - link "Harvey LAB-AA" [ref=f22e1822] [cursor=pointer]:
              - /url: "#harvey-lab-aa"
          - list [ref=f22e1823]:
            - listitem [ref=f22e1824]:
              - strong [ref=f22e1825]: "Description:"
              - text: Harvey LAB-AA is Artificial Analysis' implementation of Harvey's
              - link "Legal Agent Benchmark (LAB)" [ref=f22e1826] [cursor=pointer]:
                - /url: https://www.harvey.ai/blog/introducing-harveys-legal-agent-benchmark
              - text: ", run on Harvey's dataset of 120 private tasks spanning 24 legal practice areas. For each task the agent reads the case documents in a sandbox and produces legal deliverables - memos, disclosure schedules, deposition summaries, redlines, and similar work products. Deliverables are graded criterion-by-criterion against a task-specific rubric of atomic, binary pass/fail criteria by a single LLM judge, giving a holistic view of agentic capability on real-world legal work."
            - listitem [ref=f22e1827]:
              - strong [ref=f22e1828]: "Example dataset:"
              - text: The five public example tasks shown in the explorer are drawn from Harvey's public examples at
              - link "https://github.com/harveyai/harvey-labs" [ref=f22e1829] [cursor=pointer]:
                - /url: https://github.com/harveyai/harvey-labs
              - text: . The headline numbers are produced on Harvey's private 120-task dataset, which is not publicly released.
            - listitem [ref=f22e1830]:
              - strong [ref=f22e1831]: "Agent harness:"
              - link "https://github.com/ArtificialAnalysis/Stirrup" [ref=f22e1832] [cursor=pointer]:
                - /url: https://github.com/ArtificialAnalysis/Stirrup
            - listitem [ref=f22e1833]:
              - strong [ref=f22e1834]: "Implementation:"
              - list [ref=f22e1835]:
                - listitem [ref=f22e1836]: Each task is a self-contained legal-work assignment in one of 24 practice areas. The agent receives the task instructions, a set of read-only input documents, and the exact filenames of the deliverables it must produce, then works through the task in a single run without live interaction or iterative feedback during execution.
                - listitem [ref=f22e1837]: Input documents are the task's case materials - contracts, agreements, memos, transcripts, and other legal records - staged read-only in the sandbox. The agent copies them into a working folder, reads them with the document-processing tools available in the sandbox, and writes its deliverables (typically .docx, .xlsx, or .md) directly into its home directory under the exact filenames the task specifies.
                - listitem [ref=f22e1838]:
                  - text: All models are run using our open source agentic harness,
                  - link "Stirrup" [ref=f22e1839] [cursor=pointer]:
                    - /url: https://github.com/ArtificialAnalysis/Stirrup
                  - text: .
                  - list [ref=f22e1840]:
                    - listitem [ref=f22e1841]:
                      - strong [ref=f22e1842]: "Turns:"
                      - text: Agents run for up to 200 turns per task.
                    - listitem [ref=f22e1843]:
                      - strong [ref=f22e1844]: "Tools:"
                      - text: Within the harness, models are given a sandboxed code execution environment, and vision-capable models are additionally given an image viewer tool that reads image files from the sandbox as native image tokens for the model. The sandbox has no internet access, so the agent can only use the provided input documents and the software pre-installed in the image.
                    - listitem [ref=f22e1845]:
                      - strong [ref=f22e1846]: "Sandbox:"
                      - text: Each task runs in an isolated Linux sandbox built from a shared agent-evals base image (Debian + Python 3.13), with document-processing tooling such as Pandoc, poppler/pdftotext, LibreOffice, python-docx, python-pptx, openpyxl, pdfplumber, PyMuPDF, and markitdown pre-installed. The task's input documents are staged read-only at runtime; individual shell commands are terminated after 20 minutes.
                    - listitem [ref=f22e1847]:
                      - strong [ref=f22e1848]: "Finish tools:"
                      - text: A finish tool, which the agent calls to submit a summary and the absolute paths of its deliverables (validated to be actual files, not directories or missing paths), and an abandon_task_finish (give-up) tool, which it calls with a reason only when it concludes the task is genuinely impossible.
                - listitem [ref=f22e1849]:
                  - strong [ref=f22e1850]: "Differences from Harvey's benchmark:"
                  - text: "Harvey LAB-AA is Artificial Analysis' independent reimplementation, so our numbers are not directly comparable to Harvey's own published results. The main differences:"
                  - list [ref=f22e1851]:
                    - listitem [ref=f22e1852]: Submissions are required to match the exact filename specified in the task instructions. A near-miss filename counts as not produced, which is stricter than Harvey's best-effort matching and can lower our scores relative to theirs.
                    - listitem [ref=f22e1853]: A criterion fails outright, without being shown to the judge, only when none of its deliverables were produced. A partial submission - where some of the criterion's declared files are present - is still judged, with any missing file marked absent.
                    - listitem [ref=f22e1854]: Gemini 3.1 Pro is used as the grading model.
                    - listitem [ref=f22e1855]: We run on Stirrup's native shell tooling in an E2B sandbox with Artificial Analysis-authored agent and judge prompts, rather than Harvey's sandbox and custom tools.
                    - listitem [ref=f22e1856]: Harvey's original implementation equips the agent with custom tools and document-generation skill scripts (for example, for producing .docx, .xlsx, and .pptx files). We do not provide these, so our scores reflect raw model capability.
                - listitem [ref=f22e1857]: "Each task carries a rubric of equally-weighted, atomic, binary pass/fail criteria. Every criterion is graded against the text extracted from the criterion's declared deliverable files. Grading is text-only: the judge sees the extracted text of the deliverables, the task description, and the criterion's match criteria, and returns a strict pass or fail with no partial credit."
                - listitem [ref=f22e1858]:
                  - text: "Two headline metrics are reported:"
                  - strong [ref=f22e1859]: criterion pass rate
                  - text: ", the share of atomic pass/fail rubric criteria the deliverables satisfy (mean over criteria), and"
                  - strong [ref=f22e1860]: all-pass rate
                  - text: ", the share of tasks where every criterion passes with no partial credit. Criterion pass rate is the default metric shown across the site."
                - listitem [ref=f22e1861]:
                  - strong [ref=f22e1862]: "Prompts:"
                  - text: "The prompts used across generation and grading:"
                  - list [ref=f22e1863]:
                    - listitem [ref=f22e1864]:
                      - strong [ref=f22e1865]: "Agent system prompt:"
                      - code [ref=f22e1867]: "You are an AI agent completing a professional legal-work task. Use the tools provided to read the input documents, produce the requested deliverable files, and submit them within {max_turns} steps. When you are done you must call the `{finish_tool_name}` tool as your final step, passing a brief summary of what you accomplished and a list of absolute paths for every deliverable file. If you have genuinely concluded that the task cannot be completed - for example because required inputs are missing or a hard dependency is unavailable - call the `{abandon_task_finish}` tool with a brief reason instead. Do not use it to escape difficulty. You cannot interact with the user during the task. Make reasonable assumptions when needed and record them in your finish summary."
                    - listitem [ref=f22e1868]:
                      - strong [ref=f22e1869]: "Agent task prompt:"
                      - code [ref=f22e1871]: "<execution_context> ## Sandbox You operate inside an isolated Linux sandbox through the `code_exec` tool, which runs shell commands and lets you read, create, and edit files. Commands run as the unprivileged user `user` (UID 1000). Files you write persist on disk across calls, but **shell state does not**: each command runs in a fresh shell, so no working directory, environment variable, or other shell state carries from one call to the next. Always use absolute paths for files, and do not navigate with `cd` across calls - a `cd` in one command is gone by the next. When a step genuinely needs a different directory, chain it into the same command (e.g. `cd /home/user && python build.py`). ## No network The sandbox has no outbound connectivity, and there is no proxy, allowlist, or flag that turns it on - treat it as permanently offline. Anything that reaches the internet will fail: package installs (`pip`, `npm`, `apt`), remote `git`, and any HTTP/HTTPS request. Recognise a network block by its error signature - failed name resolution (`Could not resolve host`, `Temporary failure in name resolution`), an unreachable route (`Network is unreachable`), or a stalled connection - rather than guessing. When you see these the failure is structural: do not retry the same call or hunt for a workaround (mirrors, alternate hosts, cached copies). Re-plan using only what is already installed and the files in your workspace. ## Filesystem - Writable: everything under `/home/user/` plus `/tmp`. Use these for deliverables, intermediate files, and caches. - Read-only inputs: `/home/user/documents` - the task's input documents. Copy these into a working folder before transforming them rather than editing them in place. ## Runtime A document-processing stack is already installed - check what is present before assuming a gap: - **Reading inputs**: `pandoc` or `python3 -c \"import docx; ...\"` for Word; `pdftotext` or `python3 -c \"import pdfplumber; ...\"` for PDFs; `python3 -c \"import openpyxl; ...\"` for Excel; `markitdown <path>` as a general-purpose extractor for .docx, .xlsx, .pptx, and .pdf. `libreoffice` (the `soffice` binary) is also installed - use `soffice --headless --convert-to pdf <path>` to convert any Office format (.docx/.xlsx/.pptx, including legacy .doc/.xls) when the python parsers fall short. - **Producing deliverables**: - `.docx`: `python3 -c \"from docx import Document; ...\"` or `pandoc -o out.docx`. - `.xlsx`: `python3 -c \"import openpyxl; ...\"`. - `.md` and other plain text: write directly with `cat`/`tee`/your script. - Check availability with `pip show <pkg>` or `which <tool>` rather than installing - installs fail offline, but the document stack above is already present. - Commands are terminated after {command_timeout_minutes} minutes. Keep them bounded, persist intermediate results to disk, and split long jobs into smaller steps. ## Submitting your work Finish by calling the `{finish_tool_name}` tool - anything not submitted through it is not graded. Your call must include: 1. A short summary of what you accomplished. 2. Absolute paths to every deliverable (files only, not folders). Save each deliverable directly in `/home/user` under the exact filename the task asks for - not in a subdirectory. Save deliverables as ordinary, visible files - do not leave the only copy of your work in a dot-prefixed file or directory (e.g. `.report.docx`, `.output/report.docx`). Assume your files will be opened and edited by others after submission. If the task genuinely cannot be completed, call the `{abandon_task_finish}` tool with a brief reason instead. Use it only when you have concluded the work is impossible - not to escape a difficult task. </execution_context> <task> ### {title} {instructions} </task> <deliverables> Submit these files, by exact name, saved directly in `/home/user`: {expected_deliverables} </deliverables> Please begin working on the task now."
                    - listitem [ref=f22e1872]:
                      - strong [ref=f22e1873]: "Judge system prompt (task context and work product):"
                      - code [ref=f22e1875]: "You are evaluating a legal AI agent's work product against one binary quality criterion. <task_context_for_work_product> The work product below was produced for this legal task. Use the task only as context for what the deliverables were meant to address - judge the work product, not the task. {task_title} {task_instructions} </task_context_for_work_product> <work_product> {agent_output} </work_product>"
                    - listitem [ref=f22e1876]:
                      - strong [ref=f22e1877]: "Judge criterion prompt:"
                      - code [ref=f22e1879]: "<criterion> <title> {criterion_title} </title> <match_criteria> {match_criteria} </match_criteria> </criterion> Return `pass` only if the work product satisfies the criterion as described; otherwise `fail`."
        - generic [ref=f22e1880]:
          - heading [level=4] [ref=f22e1881]:
            - link "APEX-Agents-AA" [ref=f22e1882] [cursor=pointer]:
