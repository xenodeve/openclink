    - generic [ref=f22e19]:
      - heading [level=2] [ref=f22e20]:
        - link "Artificial Analysis Intelligence Index" [ref=f22e21] [cursor=pointer]:
          - /url: "#artificial-analysis-intelligence-index"
      - paragraph [ref=f22e22]: Artificial Analysis Intelligence Index combines a comprehensive suite of evaluation datasets to assess language model capabilities across reasoning, knowledge, maths and programming.
      - paragraph [ref=f22e23]: It is a helpful synthesis of overall language model intelligence and can be used to compare language models. Like all evaluation metrics, it has limitations and may not apply directly to every use case. However, we are confident that it is a more useful synthesis comparison between language models than any other metric in existence today.
      - paragraph [ref=f22e24]: "Artificial Analysis Intelligence Index Artificial Analysis Intelligence Index v4.1 incorporates 9 evaluations: GDPval-AA v2, 𝜏³-Banking, Terminal-Bench v2.1, SciCode, AA-LCR, AA-Omniscience, Humanity's Last Exam, GPQA Diamond, CritPt. Our methodology emphasizes fairness and real-world applicability."
      - paragraph [ref=f22e25]: We estimate a 95% confidence interval for Artificial Analysis Intelligence Index of less than ±1% - based on experiments with >10 repeats on certain models for all evaluation datasets included in Artificial Analysis Intelligence Index v4.1. Individual evaluation results may have wider than ±1% confidence intervals. We look forward to disclosing further detail from our statistical analysis in the future.
      - paragraph [ref=f22e26]: Artificial Analysis Intelligence Index is a text-only, English language evaluation suite. We benchmark models for image inputs, speech inputs and multilingual performance separately to the Intelligence Index evaluation suite.
      - generic [ref=f22e27]:
        - paragraph [ref=f22e28]: Intelligence Index evaluation suite
        - paragraph [ref=f22e29]: "Intelligence Index is calculated as a weighted average across four categories: Agents (34%), Coding (24%), Scientific Reasoning (24%) and General (18%). The weighting emphasizes agentic tasks. Category membership and per-evaluation weights are shown below."
