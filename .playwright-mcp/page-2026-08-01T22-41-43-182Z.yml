        - generic [ref=e35]:
          - heading "Output Speed" [level=4] [ref=e37]
          - paragraph [ref=e38]: Celeris-1 and Mercury 2 are the fastest models, followed by LFM2.5-VL-1.6B and Step 3.7 Flash.
        - generic [ref=e40]:
          - heading "Latency" [level=4] [ref=e42]
          - paragraph [ref=e43]: Gemini 2.5 Flash-Lite and Command A+ are the lowest latency models, followed by Gemini 2.5 Flash and Grok Build 0.1 0616.
        - generic [ref=e45]:
          - heading "Cost per Task" [level=4] [ref=e47]
          - paragraph [ref=e48]: MiMo-V2.5 and Llama 4 Scout have the lowest cost per task, followed by GPT-5.6 Luna (low) and Gemma 4 E4B.
        - generic [ref=e50]:
          - heading "Context Window" [level=4] [ref=e52]
          - paragraph [ref=e53]: Llama 4 Scout and Grok 4.20 0309 support the largest context windows, followed by Gemini 1.5 Pro (May) and Grok 4.1 Fast.
